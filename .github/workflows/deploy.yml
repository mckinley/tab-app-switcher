name: Deploy Site

# Called by CI once it passes on main (ci.yml), and by Release once a new Mac app version is
# published (release.yml), so the download link moves to it. Can also be run by hand.
on:
  workflow_call:
  workflow_dispatch:

jobs:
  deploy-site:
    name: Deploy Site
    runs-on: ubuntu-latest
    # One deploy at a time, in order
    concurrency:
      group: deploy-site
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # native/package.json is ahead of the published app while a release is building, so the
      # download link uses the latest published GitHub release instead
      - name: Find the latest Mac app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq '.tagName | ltrimstr("v")' || true)
          echo "Mac app download: ${version:-the version in native/package.json}"
          echo "PUBLIC_MAC_APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build site
        run: npm run build --workspace=site

      - name: Exclude worker from static assets
        run: echo "_worker.js" > site/dist/.assetsignore

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: site
          command: deploy
