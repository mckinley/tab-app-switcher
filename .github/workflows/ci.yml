name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare WXT types for extension
        run: npm run postinstall --workspace=extension

      - name: Run linting
        run: npm run lint:all

      - name: Run tests
        run: npm run test:all

  deploy-site:
    name: Deploy Site to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build site
        run: npm run build --workspace=site

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 7c0ef4ee4d820ffe791557c534882957
          workingDirectory: site
          command: pages deploy dist --project-name=tab-app-switcher
