name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare WXT types for extension
        run: npm run postinstall --workspace=extension

      - name: Run linting
        run: npm run lint:all

      - name: Run tests
        run: npm run test:all
