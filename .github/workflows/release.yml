name: Release

# `npm run release` (scripts/release.mjs) bumps the version and pushes a vX.Y.Z tag, which
# starts this. It checks the secrets and that the store credentials still work, runs CI, builds,
# signs and notarizes the Mac app into a draft GitHub release, and then submits the extension to
# the Chrome, Firefox and Edge stores, so a failure stops it before the stores get a version the
# Mac app doesn't have. With an App Store Connect API key it also signs, uploads and submits the
# Safari extension for App Review. Once the Mac app is uploaded the release is published (which
# is when installed apps update) and the site redeploys so its download link points at it.
#
# Run it by hand (Actions → Release → Run workflow) for a dry run: everything is built, nothing
# is signed or published, and the packages are attached to the run. Its summary says which
# secrets a real release would still be missing (`npm run release:secrets` copies them from a Mac).
#
# A tag from `npm run release -- --local` was already published from a Mac, so it only runs CI.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      local: ${{ steps.version.outputs.local }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version=$(node -p "require('./native/package.json').version")
          extension=$(node -p "require('./extension/package.json').version")
          manifest=$(sed -nE 's/^ *version: "([0-9.]+)".*/\1/p' extension/wxt.config.ts)
          if [ "$extension" != "$version" ] || [ "$manifest" != "$version" ]; then
            echo "::error::Versions differ: native $version, extension $extension, wxt.config.ts $manifest. Release with npm run release."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in the code ($version)"
              exit 1
            fi
            # Checkout keeps only the commit, so fetch the annotated tag to read its message
            git fetch --quiet --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
            if git tag --list --format='%(contents)' "$GITHUB_REF_NAME" | grep -q "Published locally"; then
              echo "::notice::$GITHUB_REF_NAME was published from a Mac (npm run release -- --local), so this run only runs CI"
              echo "local=true" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
            else
              echo "publish=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice::Dry run of v$version: building everything, publishing nothing"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Before anything is built, so a release never goes out half done for want of a secret
      - name: Check the secrets
        if: steps.version.outputs.local != 'true'
        env:
          PUBLISH: ${{ steps.version.outputs.publish }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          FIREFOX_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing() {
            for name in "$@"; do
              [ -n "${!name}" ] || printf ' %s' "$name"
            done
          }
          mac=$(missing CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID)
          {
            echo "### What a release publishes"
            echo ""
            echo "| | Status |"
            echo "| --- | --- |"
            for part in "Mac app:$mac" \
              "Chrome:$(missing CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN)" \
              "Firefox:$(missing FIREFOX_API_KEY FIREFOX_API_SECRET)" \
              "Edge:$(missing EDGE_CLIENT_ID EDGE_API_KEY EDGE_PRODUCT_ID)" \
              "Safari:$(missing ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 APPLE_TEAM_ID)"; do
              names=${part#*:}
              if [ -n "$names" ]; then status="❌ Missing secrets:$names"; else status="✅ Ready"; fi
              echo "| ${part%%:*} | $status |"
            done
            echo ""
            echo "\`npm run release:secrets\` on the Mac with the certificate and the .env files adds missing secrets."
            echo "Without the App Store Connect key, publish Safari by hand: \`npm run publish:safari\` in extension/ on a Mac."
          } >> "$GITHUB_STEP_SUMMARY"
          # An unsigned app can't be opened or auto-updated, so never publish one
          if [ "$PUBLISH" = "true" ] && [ -n "$mac" ]; then
            echo "::error::Add these repository secrets to sign and notarize the Mac app:$mac (npm run release:secrets on the Mac, or README.md → Releasing). Nothing was published."
            exit 1
          fi

      # An expired key fails here rather than after the Mac app is out (Apple is checked on macOS)
      - name: Check the store credentials still work
        if: steps.version.outputs.local != 'true'
        continue-on-error: ${{ steps.version.outputs.publish != 'true' }}
        env:
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          FIREFOX_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          node scripts/check-release-credentials.mjs chrome firefox edge appstoreconnect || {
            echo "::error::A store refused its credentials (see the log). Update the secret and tag again; nothing was published."
            exit 1
          }

  checks:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  mac:
    name: Mac app
    needs: [version, checks]
    if: needs.version.outputs.local != 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      TAG: v${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The release notes list the commits since the last release
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      # Apple refuses to notarize while an updated agreement waits to be accepted, so find out
      # before the build (a dry run reports it without failing)
      - name: Check Apple notarization
        continue-on-error: ${{ env.PUBLISH != 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/check-release-credentials.mjs --require apple

      # The certificate opens with its password and is the Developer ID one, without signing anything
      - name: Check the signing certificate
        continue-on-error: ${{ env.PUBLISH != 'true' }}
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::No CSC_LINK secret, so the Mac app can't be signed"
            exit 1
          fi
          p12="$RUNNER_TEMP/check.p12"
          keychain="$RUNNER_TEMP/check.keychain-db"
          echo "$CSC_LINK" | base64 --decode > "$p12"
          security create-keychain -p check "$keychain"
          security import "$p12" -k "$keychain" -P "$CSC_KEY_PASSWORD" -A > /dev/null
          identities=$(security find-identity -p codesigning "$keychain")
          security delete-keychain "$keychain"
          # macOS's own openssl reads the keychain's .p12 format
          cert=$(/usr/bin/openssl pkcs12 -in "$p12" -passin "pass:$CSC_KEY_PASSWORD" -nokeys 2> /dev/null || true)
          if [ -n "$cert" ] && ! echo "$cert" | /usr/bin/openssl x509 -noout -checkend $((30 * 24 * 60 * 60)) > /dev/null; then
            echo "::warning::The Developer ID certificate expires within 30 days. Renew it at developer.apple.com, then run npm run release:secrets."
          fi
          rm -f "$p12"
          echo "$identities" | grep -F "Developer ID Application" || {
            echo "::error::CSC_LINK has no Developer ID Application certificate. Run npm run release:secrets on the Mac again."
            exit 1
          }

      # Native modules come prebuilt (npmRebuild is off), and electron-builder fetches Electron itself
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build --workspace=tas && npm run build --workspace=native

      - name: Draft the GitHub release
        if: env.PUBLISH == 'true'
        run: |
          ./scripts/release-notes.sh "$TAG" > "$RUNNER_TEMP/notes.md"
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"

      - name: Package, sign, notarize and upload to the draft release
        if: env.PUBLISH == 'true'
        working-directory: native
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Upload to the draft; the publish job releases it once everything is there
          EP_DRAFT: "true"
        run: npx electron-builder --mac --publish always

      - name: Package without signing (dry run)
        if: env.PUBLISH != 'true'
        working-directory: native
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac --publish never

      - name: Attach the packages to this run
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: |
            native/dist/*.dmg
            native/dist/*.zip
            native/dist/latest-mac.yml
          retention-days: 14

  # After the Mac app, so a release that fails there doesn't reach the stores
  extension:
    name: ${{ matrix.store }} extension
    needs: [version, checks, mac]
    if: needs.version.outputs.local != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - store: Chrome
            browser: chrome
            submit: npm run publish
            required: CHROME_CLIENT_ID CHROME_CLIENT_SECRET CHROME_REFRESH_TOKEN
          - store: Firefox
            browser: firefox
            submit: ./scripts/publish-firefox.sh
            required: FIREFOX_API_KEY FIREFOX_API_SECRET
          - store: Edge
            browser: edge
            submit: ./scripts/publish-edge.sh
            required: EDGE_CLIENT_ID EDGE_API_KEY EDGE_PRODUCT_ID
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare WXT types for extension
        run: npm run postinstall --workspace=extension

      # A store without its secrets is skipped with a warning, so the others still go out
      - name: Submit to the store
        if: env.PUBLISH == 'true'
        working-directory: extension
        env:
          CHROME_EXTENSION_ID: mfcjanplaceclfoipcengelejgfngcan
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          FIREFOX_API_KEY: ${{ secrets.FIREFOX_API_KEY }}
          FIREFOX_API_SECRET: ${{ secrets.FIREFOX_API_SECRET }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
        run: |
          missing=""
          for name in ${{ matrix.required }}; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::warning::Not submitted to the ${{ matrix.store }} store. Add these repository secrets:$missing"
            exit 0
          fi
          ${{ matrix.submit }}

      - name: Package (dry run)
        if: env.PUBLISH != 'true'
        working-directory: extension
        run: npx wxt zip -b ${{ matrix.browser }}

      - name: Attach the package to this run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-extension
          path: extension/.output/*.zip
          retention-days: 14

  # Signed with Apple's cloud-managed certificates through the API key, so no certificate is stored
  safari:
    name: Safari extension
    needs: [version, checks, mac]
    if: needs.version.outputs.local != 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      PUBLISH: ${{ needs.version.outputs.publish }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      # A runner has no development certificate to archive with
      SAFARI_ARCHIVE_SIGNING: adhoc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # What's New falls back to the commits since the last release
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".tool-versions"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prepare WXT types for extension
        run: npm run postinstall --workspace=extension

      - name: Build the extension and its Xcode project
        working-directory: extension
        run: npm run build:safari && npm run convert:safari

      - name: Sign, upload and submit for App Review
        if: env.PUBLISH == 'true'
        working-directory: extension
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::warning::Safari wasn't published: there's no App Store Connect API key (ASC_KEY_PATH in native/.env, then npm run release:secrets). Run npm run publish:safari in extension/ on a Mac instead."
            exit 0
          fi
          ./scripts/publish-safari.sh

      - name: Archive and sign (dry run)
        if: env.PUBLISH != 'true'
        working-directory: extension
        env:
          SAFARI_SKIP_UPLOAD: "1"
        run: ./scripts/publish-safari.sh

  publish:
    name: Publish the release
    needs: [version, mac]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          {
            echo "### Released $TAG"
            echo ""
            echo "- Mac app: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG (installed apps update from here)"
            echo "- Chrome, Firefox and Edge: see each extension job above; store review takes a day or two"
            echo "- Safari: submitted for App Review by the Safari job above when the App Store Connect key is set; otherwise run \`npm run publish:safari\` in extension/ on a Mac ([checklist](https://github.com/$GITHUB_REPOSITORY/blob/main/resources/app-store-connect.md))"
          } >> "$GITHUB_STEP_SUMMARY"

  site:
    name: Site
    needs: publish
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
